<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Leitura de Medidor</title>
  <style>
    :root{
      --bg-blue:#0e6ea8;
      --sidebar:#f2c230;
      --card:#f2f3f5;
      --white:#ffffff;
      --text:#1f2a37;
      --muted:#6b7280;
      --shadow: 0 10px 30px rgba(0,0,0,.12);
      --radius:18px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#0e6ea8;
      color:var(--white);
    }

    .app{
      height: 100vh;
      padding: 18px;
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .shell{
      width:min(1400px, 98vw);
      height:min(760px, 96vh);
      border-radius: 26px;
      overflow:hidden;
      box-shadow: var(--shadow);
      display:flex;
    }

    .sidebar{
      width: 300px;
      background: var(--sidebar);
      color:#fff;
      padding: 26px 22px;
      display:flex;
      flex-direction:column;
      gap: 22px;
    }
    .brand{
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 20px 10px 28px;
      border-bottom: 2px solid rgba(255,255,255,.4);
    }
    .logo-ufg{
      width: 300px;
      height: auto;
      object-fit: contain;
    }
    .brand img{
      width: 300px;
      height: 78px;
      object-fit:contain;
    }
    .brand .brand-text{
      line-height:1.05;
      font-weight: 700;
      letter-spacing:.4px;
    }
    .brand .brand-text small{
      display:block;
      font-weight:600;
      opacity:.95;
      margin-top:6px;
      font-size: 12px;
      letter-spacing:.6px;
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap: 18px;
      padding: 10px 6px;
    }
    .menu a{
      text-decoration:none;
      color:#fff;
      font-size: 36px;
      font-weight: 300;
      padding: 16px 12px;
      border-radius: 12px;
      transition: background .2s ease;
    }
    .menu a:hover{ background: rgba(255,255,255,.12); }

    .main{
      flex:1;
      background: var(--bg-blue);
      padding: 34px 34px;
      display:flex;
      gap: 34px;
    }

    .left{
      flex: 1.05;
      display:flex;
      flex-direction:column;
      gap: 22px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap: 10px;
    }
    .label{
      font-size: 40px;
      font-weight: 300;
      letter-spacing:.3px;
      margin-top: 6px;
    }
    .input{
      height: 44px;
      border-radius: 8px;
      border: none;
      outline:none;
      padding: 0 16px;
      background: #fff;
      color: #111827;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
      font-size: 15px;
    }
    .input::placeholder{ color:#9ca3af; }

    .upload-title{
      font-size: 40px;
      font-weight: 300;
      margin: 10px 0 6px;
    }

    .drop{
      background: var(--card);
      border-radius: 10px;
      height: 380px;
      color: var(--muted);
      position:relative;
      padding: 18px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
    }
    .drop-top{
      display:flex;
      align-items:center;
      gap: 14px;
      color:#f2c94c;
      font-weight:600;
      user-select:none;
    }
    .icon{
      width: 18px; height: 18px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius: 6px;
    }
    .drop-center{
      height: calc(100% - 40px);
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap: 14px;
      margin-top: 6px;
    }
    .img-placeholder{
      width: 72px;
      height: 72px;
      border-radius: 10px;
      background: #f3c63b;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 8px 20px rgba(0,0,0,.12);
    }
    .img-placeholder svg{ opacity:.9; }
    .drop-hint{
      font-size: 14px;
      letter-spacing:.2px;
    }
    .file-hidden{
      position:absolute;
      inset:0;
      opacity:0;
      cursor:pointer;
    }

    .actions{
      display:flex;
      gap: 10px;
      align-items:center;
      margin-top: 10px;
    }
    .btn{
      height: 42px;
      border:none;
      border-radius: 10px;
      padding: 0 16px;
      font-weight: 700;
      cursor:pointer;
      box-shadow: var(--shadow);
    }
    .btn-primary{
      background:#f3c63b;
      color:#111827;
    }
    .btn-ghost{
      background: rgba(255,255,255,.12);
      color:#fff;
      box-shadow:none;
      border: 1px solid rgba(255,255,255,.22);
    }

    .right{
      width: 460px;
      background: var(--card);
      border-radius: 12px;
      padding: 26px 26px;
      color: #111827;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
      display:flex;
      flex-direction:column;
      gap: 16px;
    }

    .card-title{
      font-size: 46px;
      font-weight: 400;
      color:#4b5563;
    }
    .reading-row{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 16px;
      padding-bottom: 6px;
    }
    .reading-value{
      font-size: 42px;
      font-weight: 500;
      letter-spacing: .6px;
      color:#1f2937;
    }
    .unit-wrap{
      display:flex;
      align-items:center;
      gap: 10px;
      color:#6b7280;
      font-size: 14px;
      padding-bottom: 10px;
    }
    .check{
      width: 18px; height: 18px;
      background:#f3c63b;
      border-radius: 4px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      color:#111827;
      font-weight:900;
      line-height:1;
    }

    .divider{
      height: 1px;
      background: rgba(17,24,39,.14);
      margin: 8px 0 6px;
    }

    .history-title{
      font-size: 44px;
      font-weight: 500;
      color:#4b5563;
      margin: 0;
    }

    .table{
      width:100%;
      border-collapse:collapse;
      margin-top: 6px;
      font-size: 14px;
      color:#374151;
    }
    .table thead th{
      text-align:left;
      font-weight:600;
      color:#6b7280;
      padding: 10px 0 8px;
      border-bottom: 1px solid rgba(17,24,39,.18);
    }
    .table tbody td{
      padding: 12px 0;
      border-bottom: 1px dashed rgba(17,24,39,.12);
    }

    .status{
      margin-top:auto;
      font-size: 12px;
      color:#6b7280;
      background: rgba(0,0,0,.04);
      border-radius: 10px;
      padding: 10px 12px;
      white-space:pre-wrap;
    }

    @media (max-width: 1100px){
      .shell{ height:auto; }
      .main{ flex-direction:column; }
      .right{ width:100%; }
      .menu a{ font-size: 30px; }
      .label, .upload-title{ font-size: 32px; }
      .card-title, .history-title{ font-size: 34px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <img src="UFG_branco.png" alt="UFG" class="logo-ufg"/>
        </div>

        <nav class="menu">
          <a href="#" aria-current="page">Painel Geral</a>
          <a href="#">Histórico</a>
        </nav>
      </aside>

      <main class="main">
        <section class="left">
          <div class="field">
            <div class="label">Título</div>
            <input id="meterId" class="input" placeholder="id_medidor" />
          </div>

          <div class="field">
            <div class="label">Tipo</div>
            <select id="utility" class="input">
              <option value="" disabled selected>energia, água, gás</option>
              <option value="power">energia</option>
              <option value="water">água</option>
              <option value="gas">gás</option>
            </select>
          </div>

          <div class="upload-title">Submeter a leitura</div>

          <div class="drop" id="drop">
            <div class="drop-top">
              <span class="icon" title="upload">⤴</span>
              <span class="icon" title="anexar">📎</span>
              <span class="icon" title="câmera">📷</span>
            </div>

            <div class="drop-center">
              <div class="img-placeholder" id="previewBox" aria-hidden="true">
                <svg width="34" height="28" viewBox="0 0 24 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M3 2C1.895 2 1 2.895 1 4V14C1 15.105 1.895 16 3 16H21C22.105 16 23 15.105 23 14V4C23 2.895 22.105 2 21 2H3Z" stroke="#111827" stroke-width="1.4"/>
                  <path d="M4 13L9 8L13 12L16 9L20 13" stroke="#111827" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
              <div class="drop-hint">insira a imagem</div>
            </div>

            <input id="file" class="file-hidden" type="file" accept="image/*" />
          </div>

          <div class="actions">
            <button id="send" class="btn btn-primary">Enviar</button>
            <button id="clear" class="btn btn-ghost">Limpar</button>
            <input id="api" class="input" style="max-width:360px" value="http://127.0.0.1:8000" />
          </div>
        </section>

        <aside class="right">
          <div class="card-title">valor lido</div>

          <div class="reading-row">
            <div id="value" class="reading-value">—</div>
            <div class="unit-wrap">
              <span id="unit">unidade</span>
              <span class="check" id="ok">✓</span>
            </div>
          </div>

          <div class="divider"></div>

          <h2 class="history-title">Leitura anteriores</h2>

          <table class="table">
            <thead>
              <tr>
                <th>data</th>
                <th style="text-align:right">valor</th>
              </tr>
            </thead>
            <tbody id="history">
              <tr>
                <td style="color:#9ca3af">—</td>
                <td style="text-align:right;color:#9ca3af">—</td>
              </tr>
            </tbody>
          </table>

          <div id="status" class="status">Pronto.</div>
        </aside>
      </main>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function setStatus(msg){ $("status").textContent = msg; }

    function formatDate(iso){
      if(!iso) return "—";
      const d = new Date(iso);
      if (isNaN(d)) return iso.slice(0, 10);
      return d.toLocaleDateString("pt-BR");
    }

    function setReading(reading){
      const v = reading?.value ?? reading?.reading ?? reading?.valor ?? null;
      $("value").textContent = (v === null || v === undefined || v === "") ? "—" : String(v);
      $("unit").textContent = reading?.unit || reading?.utility || "unidade";
      $("ok").style.opacity = (v === null || v === undefined || v === "") ? 0.25 : 1;
    }

    function setHistory(items){
      const tbody = $("history");
      tbody.innerHTML = "";
      if(!items || !items.length){
        tbody.innerHTML = `<tr>
          <td style="color:#9ca3af">—</td>
          <td style="text-align:right;color:#9ca3af">—</td>
        </tr>`;
        return;
      }
      for(const it of items.slice(0,5)){
        const v = it?.value ?? it?.reading ?? "—";
        tbody.insertAdjacentHTML("beforeend", `
          <tr>
            <td>${formatDate(it?.timestamp)}</td>
            <td style="text-align:right">${v}</td>
          </tr>
        `);
      }
    }

    $("file").addEventListener("change", () => {
      const f = $("file").files?.[0];
      if(!f) return;
      setStatus(`Imagem selecionada: ${f.name}`);
    });

    $("clear").addEventListener("click", () => {
      $("meterId").value = "";
      $("utility").selectedIndex = 0;
      $("file").value = "";
      setReading(null);
      setHistory([]);
      setStatus("Limpo.");
    });

    async function fetchHistory(api, meter_id){
      try{
        const r = await fetch(`${api}/api/readings?meter_id=${encodeURIComponent(meter_id)}`);
        if(!r.ok) return;
        const data = await r.json();
        if(data?.items) setHistory(data.items);
      }catch{}
    }

    $("send").addEventListener("click", async () => {
      const api = $("api").value.trim().replace(/\/+$/, "");
      const meter_id = $("meterId").value.trim();
      const utility = $("utility").value;
      const file = $("file").files?.[0];

      if(!api || !meter_id || !utility || !file){
        setStatus("Preencha id_medidor, tipo e selecione a imagem.");
        return;
      }

      setStatus("Enviando…");
      const fd = new FormData();
      fd.append("meter_id", meter_id);
      fd.append("utility", utility);
      fd.append("file", file);

      try{
        const r = await fetch(`${api}/predict`, { method:"POST", body: fd });
        const data = await r.json().catch(()=> ({}));
        if(!r.ok) throw new Error(data?.detail || r.statusText);

        const job_id = data.job_id;
        setStatus(`Job criado: ${job_id}\nAguardando resultado via WebSocket…`);

        const wsUrl = api.replace("http://","ws://").replace("https://","wss://")
          + `/ws/jobs/${encodeURIComponent(job_id)}`;

        const ws = new WebSocket(wsUrl);

        ws.onmessage = async (ev) => {
          const msg = JSON.parse(ev.data);
          if(msg.status === "done"){
            setReading(msg.reading);
            setStatus("Leitura recebida ✅");
            ws.close();
            await fetchHistory(api, meter_id);
          }else if(msg.status === "timeout"){
            setStatus("Timeout aguardando leitura. Verifique se o worker está rodando.");
            ws.close();
          }else{
            setStatus(JSON.stringify(msg, null, 2));
          }
        };

        ws.onerror = () => setStatus("Erro no WebSocket. Verifique /ws/jobs/{job_id} na API.");

      }catch(e){
        setStatus("Erro: " + (e?.message || e));
      }
    });
  </script>
</body>
</html>
